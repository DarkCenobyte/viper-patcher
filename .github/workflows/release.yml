name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go mod download
      - name: Build libzstd
        run: |
          ./scripts/fetch-zstd.sh
          JOBS="$(nproc)" ./scripts/build-zstd.sh
      - name: Build and package
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          [ -n "$version" ] || version="dev"
          module="$(go list -m)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X ${module}/internal/buildinfo.Version=${version} -X ${module}/internal/buildinfo.Commit=${GITHUB_SHA} -X ${module}/internal/buildinfo.BuildDate=${build_date}"
          package="viper-patcher_${version}_linux_${GOARCH}"
          mkdir -p "dist/${package}"
          go build -trimpath -tags vipr_static_zstd -ldflags "$ldflags" -o "dist/${package}/creator" ./cmd/creator
          go build -trimpath -tags vipr_static_zstd -ldflags "$ldflags" -o "dist/${package}/patcher" ./cmd/patcher
          cp README.md LICENSE "dist/${package}/"
          mkdir -p "dist/${package}/third-party-licenses"
          cp third_party/zstd/LICENSE third_party/zstd/COPYING "dist/${package}/third-party-licenses/"
          ./scripts/collect-go-licenses.sh "dist/${package}/third-party-licenses/go-modules"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: viper-patcher-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-x86:
    name: Linux x86
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install 32-bit dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes curl gcc-multilib libc6-dev-i386 \
            libgl1-mesa-dev:i386 libx11-dev:i386 libxcursor-dev:i386 \
            libxrandr-dev:i386 libxinerama-dev:i386 libxi-dev:i386 \
            libxxf86vm-dev:i386 libwayland-dev:i386 libxkbcommon-dev:i386
          printf '#!/bin/sh\nexec gcc -m32 "$@"\n' > "$RUNNER_TEMP/gcc-386"
          chmod +x "$RUNNER_TEMP/gcc-386"
      - run: go mod download
      - name: Build 32-bit libzstd
        env:
          CC: ${{ runner.temp }}/gcc-386
        run: |
          ./scripts/fetch-zstd.sh
          JOBS="$(nproc)" ./scripts/build-zstd.sh
      - name: Build and package
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: "386"
          CC: ${{ runner.temp }}/gcc-386
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          [ -n "$version" ] || version="dev"
          module="$(go list -m)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X ${module}/internal/buildinfo.Version=${version} -X ${module}/internal/buildinfo.Commit=${GITHUB_SHA} -X ${module}/internal/buildinfo.BuildDate=${build_date}"
          package="viper-patcher_${version}_linux_386"
          mkdir -p "dist/${package}"
          go build -trimpath -tags vipr_static_zstd -ldflags "$ldflags" -o "dist/${package}/creator" ./cmd/creator
          go build -trimpath -tags vipr_static_zstd -ldflags "$ldflags" -o "dist/${package}/patcher" ./cmd/patcher
          cp README.md LICENSE "dist/${package}/"
          mkdir -p "dist/${package}/third-party-licenses"
          cp third_party/zstd/LICENSE third_party/zstd/COPYING "dist/${package}/third-party-licenses/"
          ./scripts/collect-go-licenses.sh "dist/${package}/third-party-licenses/go-modules"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: viper-patcher-linux-386
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - run: go mod download
      - name: Build libzstd
        run: |
          ./scripts/fetch-zstd.sh
          JOBS="$(sysctl -n hw.ncpu)" ./scripts/build-zstd.sh
      - name: Build and package
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          [ -n "$version" ] || version="dev"
          module="$(go list -m)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X ${module}/internal/buildinfo.Version=${version} -X ${module}/internal/buildinfo.Commit=${GITHUB_SHA} -X ${module}/internal/buildinfo.BuildDate=${build_date}"
          package="viper-patcher_${version}_darwin_arm64"
          mkdir -p "dist/${package}"
          go build -trimpath -tags vipr_static_zstd -ldflags "$ldflags" -o "dist/${package}/creator" ./cmd/creator
          go build -trimpath -tags vipr_static_zstd -ldflags "$ldflags" -o "dist/${package}/patcher" ./cmd/patcher
          cp README.md LICENSE "dist/${package}/"
          mkdir -p "dist/${package}/third-party-licenses"
          cp third_party/zstd/LICENSE third_party/zstd/COPYING "dist/${package}/third-party-licenses/"
          ./scripts/collect-go-licenses.sh "dist/${package}/third-party-licenses/go-modules"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: viper-patcher-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            goarch: amd64
            msystem: MINGW64
            package: mingw-w64-x86_64-gcc
            compiler: C:\msys64\mingw64\bin\gcc.exe
          - name: x86
            goarch: "386"
            msystem: MINGW32
            package: mingw-w64-i686-gcc
            compiler: C:\msys64\mingw32\bin\gcc.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make ${{ matrix.package }}
      - shell: pwsh
        run: go mod download
      - name: Build libzstd
        shell: pwsh
        run: |
          ./scripts/fetch-zstd.ps1
          ./scripts/build-zstd.ps1 -Architecture ${{ matrix.name }}
      - name: Build and package
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.compiler }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $version = "${{ inputs.version }}" }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }
          $module = go list -m
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X $module/internal/buildinfo.Version=$version -X $module/internal/buildinfo.Commit=$env:GITHUB_SHA -X $module/internal/buildinfo.BuildDate=$buildDate"
          $package = "viper-patcher_${version}_windows_${env:GOARCH}"
          New-Item -ItemType Directory -Force -Path "dist/$package/third-party-licenses" | Out-Null
          go build -trimpath -tags vipr_static_zstd -ldflags $ldflags -o "dist/$package/creator.exe" ./cmd/creator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -tags vipr_static_zstd -ldflags $ldflags -o "dist/$package/patcher.exe" ./cmd/patcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md, LICENSE "dist/$package/"
          Copy-Item third_party/zstd/LICENSE, third_party/zstd/COPYING "dist/$package/third-party-licenses/"
          ./scripts/collect-go-licenses.ps1 -Destination "dist/$package/third-party-licenses/go-modules"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: viper-patcher-windows-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, linux-x86, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
