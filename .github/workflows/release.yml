name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0 or v1.0.0-rc.1
        required: true
        default: v1.0.0
        type: string
      target_ref:
        description: Branch or tag to release when started manually
        required: true
        default: master
        type: string
      force_rebuild:
        description: Rebuild exact-commit artifacts even when a matching green CI run exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated CI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Resolve release tag, commit, and publication type
        id: version
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag }}
          MANUAL_TARGET_REF: ${{ github.event.inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
            source_ref="$MANUAL_TARGET_REF"
          else
            tag="$GITHUB_REF_NAME"
            source_ref="$GITHUB_REF_NAME"
          fi

          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if ! [[ "$tag" =~ $tag_pattern ]]; then
            echo "Invalid release tag: $tag" >&2
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix." >&2
            exit 1
          fi

          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_commit" != "$commit" ]; then
              echo "Existing tag $tag points to $tagged_commit, not $commit." >&2
              exit 1
            fi
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'source_ref=%s\n' "$source_ref" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"

      - name: Locate or build exact-commit release artifacts
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REF: ${{ steps.version.outputs.source_ref }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true' || false }}
        shell: bash
        run: |
          set -euo pipefail
          expected_artifact="release-${RELEASE_VERSION}-linux-amd64"

          has_expected_artifact() {
            local run_id="$1"
            local artifacts
            artifacts="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              -f per_page=100)"
            printf '%s' "$artifacts" | jq -e --arg expected "$expected_artifact" \
              'any(.artifacts[]; .name == $expected and .expired == false)' >/dev/null
          }

          find_matching_run() {
            local runs run_id
            runs="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)"
            while read -r run_id; do
              if [ -n "$run_id" ] && has_expected_artifact "$run_id"; then
                printf '%s\n' "$run_id"
                return 0
              fi
            done < <(printf '%s' "$runs" | jq -r --arg sha "$RELEASE_COMMIT" \
              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.run_number) | reverse | .[].id')
            return 1
          }

          find_active_run() {
            local runs repository_version title
            repository_version="$(tr -d '\r\n' < VERSION)"
            title="CI release ${RELEASE_VERSION}"
            runs="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f per_page=100)"
            printf '%s' "$runs" | jq -r \
              --arg sha "$RELEASE_COMMIT" \
              --arg version "$RELEASE_VERSION" \
              --arg repository_version "$repository_version" \
              --arg title "$title" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .status != "completed" and
                ((.event == "workflow_dispatch" and .display_title == $title) or
                 ($version == $repository_version and .event == "push" and .head_branch == "master"))
              )] | sort_by(.run_number) | last | .id // empty'
          }

          run_id=""
          if [ "$FORCE_REBUILD" != "true" ]; then
            run_id="$(find_matching_run || true)"
            if [ -z "$run_id" ]; then
              active_run_id="$(find_active_run)"
              if [ -n "$active_run_id" ]; then
                for attempt in $(seq 1 660); do
                  run="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}")"
                  status="$(printf '%s' "$run" | jq -r '.status')"
                  if [ "$status" != "completed" ]; then
                    sleep 10
                    continue
                  fi
                  conclusion="$(printf '%s' "$run" | jq -r '.conclusion')"
                  if [ "$conclusion" != "success" ]; then
                    echo "Exact-commit CI run $active_run_id completed with conclusion: $conclusion" >&2
                    exit 1
                  fi
                  if ! has_expected_artifact "$active_run_id"; then
                    echo "CI run $active_run_id succeeded but did not publish $expected_artifact." >&2
                    exit 1
                  fi
                  run_id="$active_run_id"
                  break
                done
                if [ -z "$run_id" ]; then
                  echo "Timed out waiting for active CI run $active_run_id." >&2
                  exit 1
                fi
              fi
            fi
          fi
          if [ -n "$run_id" ]; then
            printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
            printf 'reused=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dispatch_ref="$SOURCE_REF"
          temporary_ref=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            temporary_ref="release-ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git push origin "${RELEASE_COMMIT}:refs/heads/${temporary_ref}"
            dispatch_ref="$temporary_ref"
            printf 'temporary_ref=%s\n' "$temporary_ref" >> "$GITHUB_OUTPUT"
          fi

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --ref "$dispatch_ref" -f release_version="$RELEASE_VERSION"

          title="CI release ${RELEASE_VERSION}"
          for attempt in $(seq 1 660); do
            runs="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_COMMIT" \
              -f event=workflow_dispatch \
              -f per_page=100)"
            run_id="$(printf '%s' "$runs" | jq -r \
              --arg sha "$RELEASE_COMMIT" \
              --arg title "$title" \
              --arg started "$started_at" \
              '[.workflow_runs[] | select(.head_sha == $sha and .display_title == $title and .created_at >= $started)] | sort_by(.run_number) | last | .id // empty')"
            if [ -z "$run_id" ]; then
              sleep 10
              continue
            fi

            run="$(printf '%s' "$runs" | jq -c --argjson id "$run_id" '.workflow_runs[] | select(.id == $id)')"
            status="$(printf '%s' "$run" | jq -r '.status')"
            if [ "$status" != "completed" ]; then
              sleep 10
              continue
            fi

            conclusion="$(printf '%s' "$run" | jq -r '.conclusion')"
            if [ "$conclusion" != "success" ]; then
              echo "Exact-commit CI run $run_id completed with conclusion: $conclusion" >&2
              exit 1
            fi
            if ! has_expected_artifact "$run_id"; then
              echo "CI run $run_id succeeded but did not publish $expected_artifact." >&2
              exit 1
            fi

            printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
            printf 'reused=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "Timed out waiting for a versioned CI build of $RELEASE_COMMIT." >&2
          exit 1

      - name: Remove temporary manual-build ref
        if: always() && steps.ci-run.outputs.temporary_ref != ''
        env:
          TEMPORARY_REF: ${{ steps.ci-run.outputs.temporary_ref }}
        shell: bash
        run: git push origin --delete "$TEMPORARY_REF" || true

      - name: Download exact CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloaded dist
          mkdir -p downloaded dist
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' dist/ \;

      - name: Verify complete release archive set
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          expected=(
            "viper-patcher_${version}_linux_amd64.tar.gz"
            "viper-patcher_${version}_linux_arm64.tar.gz"
            "viper-patcher_${version}_linux_386.tar.gz"
            "viper-patcher_${version}_darwin_arm64.tar.gz"
            "viper-patcher_${version}_windows_amd64.zip"
            "viper-patcher_${version}_windows_386.zip"
            "viper-patcher-cli_${version}_linux_amd64.tar.gz"
            "viper-patcher-cli_${version}_linux_arm64.tar.gz"
            "viper-patcher-cli_${version}_linux_386.tar.gz"
            "viper-patcher-cli_${version}_darwin_arm64.tar.gz"
            "viper-patcher-cli_${version}_windows_amd64.zip"
            "viper-patcher-cli_${version}_windows_386.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "dist/$archive" || {
              echo "Missing release archive: $archive" >&2
              exit 1
            }
          done
          actual="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          if [ "$actual" -ne "${#expected[@]}" ]; then
            echo "Unexpected release archive count: $actual" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Generate SBOM, provenance, and checksums
        env:
          CI_RUN_ID: ${{ steps.ci-run.outputs.run_id }}
          CI_ARTIFACTS_REUSED: ${{ steps.ci-run.outputs.reused }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go run ./scripts/sbom -output dist/SBOM.spdx.json
          cat > dist/BUILD-PROVENANCE.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "tag": "${RELEASE_TAG}",
            "version": "${RELEASE_VERSION}",
            "commit": "${RELEASE_COMMIT}",
            "ci_workflow": "ci.yml",
            "ci_run_id": "${CI_RUN_ID}",
            "ci_artifacts_reused": "${CI_ARTIFACTS_REUSED}",
            "release_workflow": "${GITHUB_WORKFLOW}",
            "release_run_id": "${GITHUB_RUN_ID}",
            "release_run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
          cd dist
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)
          sha256sum "${archives[@]}" SBOM.spdx.json BUILD-PROVENANCE.json > SHA256SUMS.txt

      - name: Attest release promotion
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SBOM.spdx.json
            dist/SHA256SUMS.txt
          predicate-type: https://github.com/DarkCenobyte/viper-patcher/blob/master/docs/SUPPLY-CHAIN.md#release-provenance-attestation
          predicate-path: dist/BUILD-PROVENANCE.json

      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/SBOM.spdx.json

      - name: Publish or revise one GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.commit }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
