name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish validated CI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Validate tag and synchronized metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          repository_version="$(tr -d '\r\n' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [ "$repository_version" != "$version" ]; then
            echo "Tag $tag does not match VERSION=$repository_version" >&2
            exit 1
          fi
          for metadata in cmd/creator/FyneApp.toml cmd/patcher/FyneApp.toml; do
            if ! grep -Fxq "Version = \"$version\"" "$metadata"; then
              echo "$metadata is not synchronized with VERSION=$version" >&2
              exit 1
            fi
          done
          if ! grep -Fq "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Locate successful CI run for the exact commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            runs="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event=push \
              -f per_page=100)"
            run_id="$(printf '%s' "$runs" | jq -r \
              '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "master" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty')"
            if [ -n "$run_id" ]; then
              printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed="$(printf '%s' "$runs" | jq -r \
              '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "master" and .status == "completed" and .conclusion != "success")] | length')"
            active="$(printf '%s' "$runs" | jq -r \
              '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "master" and .status != "completed")] | length')"
            if [ "$failed" -gt 0 ] && [ "$active" -eq 0 ]; then
              echo "The exact commit has no successful CI run." >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for a successful CI run for $GITHUB_SHA." >&2
          exit 1

      - name: Download exact CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloaded dist
          mkdir -p downloaded dist
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' dist/ \;

      - name: Verify complete release archive set
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          expected=(
            "viper-patcher_${version}_linux_amd64.tar.gz"
            "viper-patcher_${version}_linux_arm64.tar.gz"
            "viper-patcher_${version}_linux_386.tar.gz"
            "viper-patcher_${version}_darwin_arm64.tar.gz"
            "viper-patcher_${version}_windows_amd64.zip"
            "viper-patcher_${version}_windows_386.zip"
            "viper-patcher-cli_${version}_linux_amd64.tar.gz"
            "viper-patcher-cli_${version}_linux_arm64.tar.gz"
            "viper-patcher-cli_${version}_linux_386.tar.gz"
            "viper-patcher-cli_${version}_darwin_arm64.tar.gz"
            "viper-patcher-cli_${version}_windows_amd64.zip"
            "viper-patcher-cli_${version}_windows_386.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "dist/$archive" || {
              echo "Missing release archive: $archive" >&2
              exit 1
            }
          done
          actual="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          if [ "$actual" -ne "${#expected[@]}" ]; then
            echo "Unexpected release archive count: $actual" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Generate SBOM, provenance, and checksums
        env:
          CI_RUN_ID: ${{ steps.ci-run.outputs.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go run ./scripts/sbom -output dist/SBOM.spdx.json
          cat > dist/BUILD-PROVENANCE.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "tag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "ci_workflow": "ci.yml",
            "ci_run_id": "${CI_RUN_ID}",
            "release_workflow": "${GITHUB_WORKFLOW}",
            "release_run_id": "${GITHUB_RUN_ID}",
            "release_run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
          cd dist
          mapfile -t archives < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)
          sha256sum "${archives[@]}" SBOM.spdx.json BUILD-PROVENANCE.json > SHA256SUMS.txt

      - name: Publish one GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
