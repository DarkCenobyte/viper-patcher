name: Native sanitizers
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build pinned libzstd 1.5.7
        run: |
          bash scripts/fetch-zstd.sh
          bash scripts/build-zstd.sh
          test -f build/zstd/lib/libzstd.a
      - name: Native and integration tests
        env:
          CC: clang
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-O2 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          CGO_LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: go test -count=1 -tags vipr_static_zstd ./internal/nativev4 ./internal/patchformat ./internal/patch
