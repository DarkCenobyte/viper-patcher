name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Download dependencies
        run: go mod download

      - name: Build libzstd 1.5.7
        run: |
          ./scripts/fetch-zstd.sh
          JOBS="$(nproc)" ./scripts/build-zstd.sh

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "These files are not formatted:"
            gofmt -l .
            exit 1
          }

      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: go test -race -count=1 -tags vipr_static_zstd,migrated_fynedo ./...

      - name: Run native sanitizer tests
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          CGO_LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: go test -count=1 -tags vipr_static_zstd,migrated_fynedo ./internal/zstd ./internal/patch

      - name: Run go vet
        env:
          CGO_ENABLED: "1"
        run: go vet -tags vipr_static_zstd,migrated_fynedo ./...

      - name: Run vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -tags vipr_static_zstd,migrated_fynedo ./...

      - name: Enforce core coverage threshold
        env:
          CGO_ENABLED: "1"
        run: |
          packages="./internal/appmode ./internal/buildinfo ./internal/cli/... ./internal/hashutil ./internal/patch ./internal/patchformat ./internal/pathutil ./internal/progress ./internal/zstd"
          go test -count=1 -tags vipr_static_zstd,migrated_fynedo -coverprofile=coverage.out $packages
          go tool cover -func=coverage.out | tee coverage.txt
          coverage="$(awk '$1 == "total:" { gsub(/%/, "", $3); print $3 }' coverage.txt)"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 80) { printf "Core coverage %.1f%% is below 80%%.\n", coverage; exit 1 } }'

      - name: Compile executables
        env:
          CGO_ENABLED: "1"
        run: |
          module="$(go list -m)"
          ldflags="-s -w -X ${module}/internal/buildinfo.Version=ci -X ${module}/internal/buildinfo.Commit=${GITHUB_SHA} -X ${module}/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -tags vipr_static_zstd,migrated_fynedo -ldflags "$ldflags" -o /tmp/creator ./cmd/creator
          go build -trimpath -tags vipr_static_zstd,migrated_fynedo -ldflags "$ldflags" -o /tmp/patcher ./cmd/patcher
